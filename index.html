<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7657e8" />
  <title>Lexi Phoneme Recorder V3</title>
  <style>
    :root {
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17213e;
      background: #f8f7fc;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(180deg,#faf9fd 0%,#f5f3fb 100%); }
    button { font: inherit; }
    .app { max-width: 900px; margin: 0 auto; padding: 28px 22px 54px; }
    .topbar { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:22px; }
    .brand { font-size: 1.1rem; font-weight: 900; letter-spacing:.02em; color:#6d4dde; }
    .progress-label { font-weight:800; color:#706b83; }
    .progress { height:12px; background:#e8e4f2; border-radius:999px; overflow:hidden; margin-bottom:28px; }
    .progress > div { height:100%; background:#7657e8; transition:width .25s ease; }
    .card { background:#fff; border:1px solid #e5e1ed; border-radius:32px; box-shadow:0 18px 50px rgba(48,37,91,.07); padding:34px; }
    .eyebrow { color:#7657e8; font-weight:900; letter-spacing:.08em; font-size:.9rem; text-transform:uppercase; }
    h1 { font-size:clamp(2rem,5vw,3.25rem); line-height:1.05; margin:10px 0 8px; color:#24203c; }
    .example { font-size:1.2rem; color:#6e687f; font-weight:750; margin:0 0 28px; }
    .sound { display:flex; align-items:center; justify-content:center; min-height:150px; background:#f4f0ff; border-radius:26px; margin:24px 0; }
    .sound strong { font-size:clamp(3.5rem,12vw,6.5rem); color:#6244d3; }
    .tip { padding:16px 18px; background:#fff8e7; border-radius:18px; color:#5f543a; font-weight:700; line-height:1.45; margin-bottom:24px; }
    .record-wrap { display:flex; flex-direction:column; align-items:center; gap:12px; padding:10px 0 20px; }
    .record { width:112px; height:112px; border-radius:50%; border:0; background:#7657e8; color:#fff; font-weight:900; box-shadow:0 10px 0 #5c3ec9; cursor:pointer; touch-action:manipulation; }
    .record.recording { background:#e45b70; box-shadow:0 10px 0 #be4055; animation:pulse 1.2s infinite; }
    @keyframes pulse { 50% { transform:scale(1.04); } }
    .status { color:#716a82; font-weight:800; min-height:24px; text-align:center; }
    .playback { display:none; margin-top:10px; padding-top:24px; border-top:1px solid #eeeaf4; }
    .playback.show { display:block; }
    audio { width:100%; margin:8px 0 20px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .btn { border:0; border-radius:18px; padding:16px 18px; font-weight:900; cursor:pointer; }
    .secondary { background:#eee9fb; color:#6043c8; }
    .primary { background:#7657e8; color:white; }
    .primary:disabled { opacity:.4; cursor:not-allowed; }
    .footer-actions { display:flex; justify-content:space-between; gap:12px; margin-top:18px; }
    .small { border:0; background:transparent; color:#716a82; font-weight:800; padding:10px; cursor:pointer; }
    .done { text-align:center; padding:28px 0 8px; }
    .done .badge { width:100px; height:100px; margin:0 auto 18px; display:grid; place-items:center; border-radius:30px; background:#f0ebff; font-size:48px; }
    .done p { color:#6e687f; font-weight:700; line-height:1.5; }
    .download { width:100%; margin-top:20px; }
    .notice { margin-top:18px; color:#777184; font-size:.92rem; line-height:1.45; }
    @media (max-width:600px) {
      .app { padding:18px 14px 40px; }
      .card { padding:24px 20px; border-radius:26px; }
      .actions { grid-template-columns:1fr; }
      .sound { min-height:125px; }
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">LEXI · AUDIO STUDIO V3</div>
    <div id="count" class="progress-label">1 / 11</div>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <main class="card" id="card"></main>
</div>

<script>
const sounds = [
  { key:'b', file:'b.webm', display:'/b/', example:'as in “bat”', tip:'Make it quick and clean. Do not add “uh” after the sound.' },
  { key:'ch', file:'ch.webm', display:'/ch/', example:'as in “chip”', tip:'A short, clean /ch/. Do not say the letter names C-H.' },
  { key:'l', file:'l.webm', display:'/l/', example:'as in “lip”', tip:'Hold the sound gently: llll. Do not say “el.”' },
  { key:'m', file:'m.webm', display:'/m/', example:'as in “map”', tip:'Hold the sound smoothly: mmmm. Do not say “em.”' },
  { key:'p', file:'p.webm', display:'/p/', example:'as in “pig”', tip:'Make it very short. Do not add “uh” after the sound.' },
  { key:'r', file:'r.webm', display:'/r/', example:'as in “run”', tip:'Use the beginning sound in “run,” not the letter name “ar.”' },
  { key:'s', file:'s.webm', display:'/s/', example:'as in “sun”', tip:'Hold one continuous sound: ssss — not repeated S-S-S.' },
  { key:'sh', file:'sh.webm', display:'/sh/', example:'as in “ship”', tip:'Hold one smooth sound: shhhh.' },
  { key:'short_a', file:'short-a.webm', display:'/ă/', example:'as in “map” or “apple”', tip:'Record only the short vowel sound, not the whole example word.' },
  { key:'short_i', file:'short-i.webm', display:'/ĭ/', example:'as in “sit”', tip:'Record only the short vowel sound in “sit.”' },
  { key:'short_o', file:'short-o.webm', display:'/ŏ/', example:'as in “mop”', tip:'Record only the short vowel sound in “mop.”' }
];

let index = 0;
let recorder = null;
let chunks = [];
let stream = null;
let currentBlob = null;
const recordings = new Map();
const card = document.getElementById('card');
const count = document.getElementById('count');
const bar = document.getElementById('bar');

function render() {
  if (index >= sounds.length) return renderDone();
  const s = sounds[index];
  count.textContent = `${index + 1} / ${sounds.length}`;
  bar.style.width = `${(index / sounds.length) * 100}%`;
  card.innerHTML = `
    <div class="eyebrow">Phoneme ${index + 1}</div>
    <h1>Record ${s.display}</h1>
    <p class="example">${s.example}</p>
    <div class="sound"><strong>${s.display}</strong></div>
    <div class="tip">🎙️ ${s.tip}</div>
    <div class="record-wrap">
      <button id="record" class="record">RECORD</button>
      <div id="status" class="status">Tap once to start. Tap again to stop.</div>
    </div>
    <section id="playback" class="playback">
      <strong>Listen back</strong>
      <audio id="audio" controls></audio>
      <div class="actions">
        <button id="redo" class="btn secondary">Record again</button>
        <button id="keep" class="btn primary">Keep & continue</button>
      </div>
    </section>
    <div class="footer-actions">
      <button id="back" class="small" ${index===0?'disabled':''}>← Previous</button>
      <button id="skip" class="small">Skip for now →</button>
    </div>
  `;
  document.getElementById('record').onclick = toggleRecord;
  document.getElementById('redo').onclick = () => { currentBlob=null; document.getElementById('playback').classList.remove('show'); document.getElementById('status').textContent='Ready for another take.'; };
  document.getElementById('keep').onclick = keep;
  document.getElementById('back').onclick = () => { if(index>0){ index--; currentBlob=recordings.get(sounds[index].key) || null; render(); if(currentBlob) showPlayback(currentBlob); } };
  document.getElementById('skip').onclick = () => { index++; currentBlob=null; render(); };
  const existing = recordings.get(s.key);
  if (existing) showPlayback(existing);
}

async function ensureMic() {
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('Microphone recording is not supported in this browser.');
  if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  return stream;
}

async function toggleRecord() {
  const button = document.getElementById('record');
  const status = document.getElementById('status');

  if (recorder && recorder.state === 'recording') {
    // Safari can otherwise stop without giving us a usable final chunk.
    try { recorder.requestData(); } catch (_) {}
    window.setTimeout(() => {
      if (recorder && recorder.state === 'recording') recorder.stop();
    }, 120);
    button.classList.remove('recording');
    button.textContent = 'RECORD';
    status.textContent = 'Saving your recording…';
    return;
  }

  try {
    cleanupPlayback();
    const mic = await ensureMic();
    chunks = [];

    // iPad/Safari generally behaves best with MP4 when MediaRecorder supports it.
    const candidates = [
      'audio/mp4;codecs=mp4a.40.2',
      'audio/mp4',
      'audio/webm;codecs=opus',
      'audio/webm'
    ];
    const preferred = candidates.find(type => MediaRecorder.isTypeSupported(type)) || '';
    recorder = preferred ? new MediaRecorder(mic, { mimeType: preferred }) : new MediaRecorder(mic);

    recorder.ondataavailable = event => {
      if (event.data && event.data.size > 0) chunks.push(event.data);
    };

    recorder.onerror = event => {
      status.textContent = 'Recording failed. Please try this sound again.';
      console.error('MediaRecorder error', event);
    };

    recorder.onstop = async () => {
      // Give Safari a moment to dispatch its last dataavailable event.
      await new Promise(resolve => window.setTimeout(resolve, 150));

      const mimeType = recorder?.mimeType || preferred || 'audio/mp4';
      const blob = new Blob(chunks, { type: mimeType });

      // Never allow an empty/invalid take to be kept.
      if (!blob.size || blob.size < 500) {
        currentBlob = null;
        status.textContent = 'No audio was captured. Please record this sound again.';
        document.getElementById('playback').classList.remove('show');
        return;
      }

      currentBlob = blob;
      status.textContent = `Audio captured ✓ (${Math.round(blob.size / 1024)} KB). Listen before you keep it.`;
      showPlayback(blob);
    };

    // A timeslice is important on Safari: it causes periodic dataavailable events
    // instead of relying only on a final chunk when stop() is called.
    recorder.start(250);
    button.classList.add('recording');
    button.textContent = 'STOP';
    status.textContent = 'Recording… say the sound once, then tap Stop.';
  } catch (err) {
    status.textContent = err?.message || 'Could not access the microphone. Check Safari microphone permission.';
  }
}
function showPlayback(blob) {
  const playback = document.getElementById('playback');
  const audio = document.getElementById('audio');
  const keepButton = document.getElementById('keep');
  if (!playback || !audio) return;

  if (!blob || blob.size < 500) {
    playback.classList.remove('show');
    if (keepButton) keepButton.disabled = true;
    return;
  }

  if (audio.dataset.objectUrl) URL.revokeObjectURL(audio.dataset.objectUrl);
  const url = URL.createObjectURL(blob);
  audio.dataset.objectUrl = url;
  audio.src = url;
  audio.preload = 'metadata';
  audio.load();

  audio.onloadedmetadata = () => {
    if (keepButton) keepButton.disabled = false;
  };
  audio.onerror = () => {
    if (keepButton) keepButton.disabled = true;
    document.getElementById('status').textContent =
      'The recording has data but Safari could not play it. Please record this sound again.';
  };

  playback.classList.add('show');
}
function keep() {
  if (!currentBlob || currentBlob.size < 500) {
    document.getElementById('status').textContent = 'This take has no usable audio. Please record it again.';
    return;
  }
  recordings.set(sounds[index].key, currentBlob);
  index++;
  currentBlob=null;
  render();
}

function extensionFor(blob) {
  if (blob.type.includes('mp4')) return 'm4a';
  if (blob.type.includes('ogg')) return 'ogg';
  return 'webm';
}

async function downloadAllZip() {
  const status = document.getElementById('zipStatus');
  const button = document.getElementById('download');
  button.disabled = true;
  button.textContent = 'Building ZIP…';

  try {
    if (typeof JSZip === 'undefined') {
      throw new Error('ZIP support did not load. Check your internet connection and reload the page.');
    }

    const zip = new JSZip();
    const folder = zip.folder('lexi-phonemes');

    for (const s of sounds) {
      const blob = recordings.get(s.key);
      if (!blob) continue;
      if (blob.size < 500) throw new Error(`The ${s.display} recording is empty. Re-record it before downloading.`);
      folder.file(`${s.key.replaceAll('_','-')}.${extensionFor(blob)}`, blob);
    }

    folder.file(
      'README.txt',
      'Lexi phoneme recordings. These are browser-native recordings. Convert the accepted takes to production MP3 files before placing them in public/audio/phonemes/.'
    );

    const archive = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    const url = URL.createObjectURL(archive);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lexi-phoneme-recordings.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);

    status.textContent = '✓ ZIP created. Check Files / Downloads.';
    button.textContent = 'Download All as ZIP';
  } catch (err) {
    status.textContent = err.message || 'Could not create the ZIP.';
    button.textContent = 'Try Download All Again';
  } finally {
    button.disabled = false;
  }
}

function renderDone() {
  count.textContent = `${recordings.size} recorded`;
  bar.style.width = '100%';
  const missing = sounds.filter(s => !recordings.has(s.key));
  card.innerHTML = `
    <div class="done">
      <div class="badge">🎧</div>
      <div class="eyebrow">Recording session complete</div>
      <h1>${recordings.size} phonemes ready</h1>
      <p>${missing.length ? `${missing.length} sound${missing.length===1?' is':'s are'} still missing. You can go back and record them.` : 'You recorded the complete starter phoneme set.'}</p>
      <button id="download" class="btn primary download" ${recordings.size===0?'disabled':''}>Download All as ZIP</button>
      <div id="zipStatus" class="status"></div>
      <button id="review" class="btn secondary download">Review recordings</button>
      <p class="notice"><strong>iPad note:</strong> the ZIP contains the actual browser-recorded files. We can convert the final accepted takes to Lexi's production MP3 files afterward.</p>
    </div>`;
  document.getElementById('review').onclick = () => { index=0; render(); };
  document.getElementById('download').onclick = downloadAllZip;
}
render();
</script>
</body>
</html>
